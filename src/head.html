<title>광교 우리 집 조망 투어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: full-bleed 3D view; a quiet glass control strip along the bottom, facts in the top-left */
:root{
  --bg:#07090c; --panel:rgba(14,17,22,.80); --line:rgba(255,255,255,.20); --fg:#f1f2f3; --dim:#a9afb8; --sun:#f3b765; --sun-ink:#1d1406;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
#top{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(300px,calc(100% - min(46vw,230px) - 36px))}
#hud:not(.min)~#stick{display:none}
#map,.btn,.chips button{-webkit-tap-highlight-color:transparent}
#title{display:flex;gap:8px;align-items:baseline;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#title b{font-weight:700} #title span{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
#facts{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#mapbox{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:4;width:min(46vw,230px);aspect-ratio:14.96/9.9;background:rgba(10,13,18,.5);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden}
#mapcredit{position:absolute;right:3px;bottom:2px;padding:1px 3px;background:#172123;color:#e6e8e4;font:9px system-ui;text-decoration:none}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;padding:6px 10px;border-radius:9px;background:rgba(10,13,18,.82);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13px;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#tip b{font-weight:700} #tip span{margin-left:8px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#stage.clean #top,#stage.clean #mapbox,#stage.clean #hud,#stage.clean #tip,#stage.clean #stick{display:none}
#toast{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;pointer-events:none;padding:8px 14px;border-radius:999px;background:rgba(10,13,18,.8);border:1px solid var(--line);font-size:13px;white-space:nowrap}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;background:rgba(14,17,22,.38);border:1px solid var(--line);touch-action:none;display:none;z-index:4}
#stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.55)}
@media (pointer:coarse){ #stick{display:block} #stick.off{display:none} }
#roomsbar .btn{background:rgba(12,15,20,.84);border-color:rgba(255,255,255,.30);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#top h1{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
#top p{margin:3px 0 0;font-size:12px;color:var(--dim)}
#info{margin-top:10px;display:grid;justify-content:start;grid-template-columns:auto auto;gap:2px 12px;font-size:12px;font-variant-numeric:tabular-nums}
#info dt{color:var(--dim)} #info dd{margin:0}
#hud{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:stretch;pointer-events:none}
#hud>*{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);display:flex;flex-direction:column;gap:9px;max-width:920px;width:100%;margin:0 auto;box-sizing:border-box}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row label{flex:none;width:34px;font-size:12px;color:var(--dim)}
.row output{flex:none;width:62px;text-align:right;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;height:26px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7.5px;border-radius:50%;background:var(--sun);border:0;box-shadow:0 0 0 4px rgba(243,183,101,.18)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--sun);border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chips button,.btn{font:inherit;font-size:12.5px;color:var(--fg);background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true],.btn[aria-pressed=true],#roomsbar .btn[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:700}
.chips button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.grp{display:flex;gap:8px;align-items:center;min-width:0}
.grp>span{flex:none;font-size:12px;color:var(--dim);width:34px}
.cols{display:flex;gap:8px 18px;flex-wrap:wrap}
#roomsbar{display:flex;justify-content:flex-end;gap:6px;align-items:flex-end;max-width:920px;width:100%;margin:0 auto}
#hud.min .panel{display:none}
#load{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .8s;z-index:5;padding:0 24px;text-align:center}
#load.done{opacity:0;pointer-events:none}
#load h2{margin:0;font-size:20px;font-weight:700}
#load p{margin:0;font-size:13px;color:var(--dim);min-height:1.4em}
#track{width:min(260px,70vw);height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
#bar{height:100%;width:0;background:var(--sun);transition:width .3s}
@media (max-width:560px){ #info{font-size:11px} .panel{padding:9px 10px;gap:7px} .chips button,.btn{padding:5px 9px;font-size:12px} }
@media (prefers-reduced-motion:reduce){ #load,#bar{transition:none} }
#imageryCredit{position:absolute;right:4px;bottom:2px;z-index:2;background:rgba(15,20,23,.65);color:#fff;padding:2px 4px;font:9px/1.2 sans-serif;text-decoration:none}
</style>
<div id="stage">
  <canvas id="cv"></canvas>
  <a id="imageryCredit" href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener">영상 © Esri, Vantor, Earthstar Geographics, GIS User Community</a>
  <div id="tip" hidden><b></b><span></span></div>
  <div id="top">
    <button id="title" class="btn" type="button" aria-expanded="false"><b id="roomLab">거실</b><span id="clock"></span></button>
    <div id="facts" hidden>
      <h1>광교 자연앤 센트레빌 1703동 1702호</h1>
      <p>84B · 17층 · 남동향 · 2029년 10월 입주 예정</p>
      <p>원천동 633 · 9개 동 600세대 · 분양계획 기준 조망</p>
      <p><a style="color:inherit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">도로·정류장 © OpenStreetMap 기여자</a></p>
      <dl id="info">
        <dt>일출·일몰</dt><dd><span id="i-rise">–</span> · <span id="i-set">–</span></dd>
        <dt>모의 교통량</dt><dd id="i-traffic">–</dd>
        <dt>해 위치</dt><dd id="i-sun">–</dd>
        <dt>거실 직사광</dt><dd id="i-liv">–</dd>
      </dl>
    </div>
  </div>
  <div id="mapbox"><canvas id="map" aria-label="평면도. 눌러서 이동"></canvas><a id="mapcredit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" hidden>© OpenStreetMap</a></div>
  <div id="hud" class="min">
    <div class="panel">
      <div class="row"><label for="doy">날짜</label><input id="doy" type="range" min="0" max="364" step="1"><output id="dateLab" for="doy"></output></div>
      <div class="row"><label for="hr">시각</label><input id="hr" type="range" min="0" max="23.99" step="0.01"><output id="timeLab" for="hr"></output></div>
      <div class="cols">
        <div class="grp"><span>계절</span><div class="chips" id="seasons"></div><button class="btn" id="play" type="button" aria-pressed="false">하루 재생</button></div>
        <div class="grp"><span>날씨</span><div class="chips" id="wx"></div></div>
        <div class="grp"><span>조명</span><div class="chips" id="lights"></div></div>
      </div>
    </div>
    <div id="roomsbar"><button class="btn" id="hide" type="button" aria-pressed="false">시간·날씨</button><button class="btn" id="drone" type="button" aria-pressed="false">단지 전경</button><button class="btn" id="orbit" type="button" aria-pressed="false" hidden>자동 회전</button><button class="btn" id="clean" type="button">가리기</button><button class="btn" id="fs" type="button" aria-pressed="false">전체화면</button><button class="btn" id="bgm" type="button" aria-pressed="false">음악</button><a class="btn" id="bgmsrc" href="https://youtu.be/z13_ZlsAlYQ" target="_blank" rel="noopener" style="text-decoration:none">원곡 열기</a></div>
  </div>
  <div id="stick" aria-hidden="true"><i></i></div>
  <div id="toast" hidden></div>
  <div id="load"><h2>광교 우리 집 조망 투어</h2><p id="loadmsg">준비 중</p><div id="track"><div id="bar"></div></div></div>
</div>
